<!DOCTYPE html><html><head><meta charset="UTF-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070c09;overflow:hidden;width:100vw;height:100vh;font-family:'Inter',sans-serif}
canvas{position:absolute;top:0;left:0}
.ui{position:absolute;inset:0;padding:8px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.hud{display:flex;justify-content:space-between}
.chip{background:rgba(0,0,0,.7);border:1px solid rgba(74,222,128,.3);border-radius:5px;padding:3px 8px}
.chip-l{font-size:6px;font-weight:700;letter-spacing:.1em;color:rgba(74,222,128,.7);text-transform:uppercase}
.chip-v{font-size:9px;font-weight:700;color:#4ade80}
.bars{flex:1;display:flex;align-items:flex-end;gap:8px;padding:16px 10px 4px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.bar-bg{width:100%;height:90px;display:flex;align-items:flex-end;position:relative}
.bar-fill{width:100%;border-radius:3px 3px 0 0;transition:height 1.4s}
.bar-val{font-size:7px;font-weight:700;color:#4ade80;text-align:center;min-height:10px}
.bar-label{font-size:5.5px;color:rgba(255,255,255,.35);text-align:center;line-height:1.3}
.bottom{display:flex;gap:5px;flex-shrink:0}
.stat-box{flex:1;background:rgba(0,0,0,.5);border:1px solid rgba(74,222,128,.15);border-radius:5px;padding:4px 6px;text-align:center}
.stat-l{font-size:5.5px;color:rgba(74,222,128,.5);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat-v{font-size:9px;font-weight:700;color:#4ade80}
.quality-bar{height:5px;border-radius:2px;background:rgba(255,255,255,.06);margin-top:3px;overflow:hidden}
.quality-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#4ade80,#34d399);transition:width 1.4s}
</style></head><body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="hud">
    <div class="chip"><div class="chip-l">AI-MPG · AISI 2027</div><div class="chip-v">Quality-Adjusted Energy Efficiency</div></div>
    <div class="chip"><div class="chip-l">Best gain</div><div class="chip-v">12.5×</div></div>
  </div>
  <div class="bars" id="bars"></div>
  <div class="bottom">
    <div class="stat-box"><div class="stat-l">Caching alone</div><div class="stat-v">3× E_QAT</div></div>
    <div class="stat-box"><div class="stat-l">Full stack</div><div class="stat-v">12.5×</div></div>
    <div class="stat-box"><div class="stat-l">Quality gate</div><div class="stat-v">SLA required</div></div>
    <div class="stat-box"><div class="stat-l">Non-conformant</div><div class="stat-v">Withheld ✗</div></div>
  </div>
</div>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
c.width=c.clientWidth||400;c.height=c.clientHeight||240;

function drawBg(){
  ctx.fillStyle='#070c09';ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle='rgba(74,222,128,0.04)';ctx.lineWidth=1;
  for(let x=0;x<c.width;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke()}
  for(let y=0;y<c.height;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke()}
}

const configs=[
  {label:'Baseline\n(no opt)',eqat:1.0,quality:0.78,color:'rgba(74,222,128,0.25)',pass:true},
  {label:'+ Caching',eqat:3.0,quality:0.79,color:'rgba(74,222,128,0.5)',pass:true},
  {label:'+ Routing',eqat:6.2,quality:0.80,color:'rgba(74,222,128,0.7)',pass:true},
  {label:'Full stack',eqat:12.5,quality:0.81,color:'rgba(74,222,128,1.0)',pass:true},
  {label:'Non-conform',eqat:15.0,quality:0.61,color:'rgba(248,113,113,0.6)',pass:false},
];

const barsEl=document.getElementById('bars');
configs.forEach((cfg,i)=>{
  const wrap=document.createElement('div');
  wrap.className='bar-wrap';
  const maxEqat=15;
  const heightPct=(cfg.eqat/maxEqat*100);
  const qualityPct=(cfg.quality*100);
  wrap.innerHTML=`
    <div class="bar-val" id="bv${i}">${cfg.pass?cfg.eqat+'×':'—'}</div>
    <div class="bar-bg">
      <div id="bf${i}" class="bar-fill" style="background:${cfg.color};height:0%"></div>
    </div>
    <div class="bar-label">${cfg.label}</div>
    ${cfg.pass?`<div class="quality-bar"><div id="bq${i}" class="quality-fill" style="width:0%;background:${cfg.color}"></div></div>`:'<div class="quality-bar"><div style="height:100%;background:rgba(248,113,113,0.3);border-radius:2px"></div></div>'}
    `;
  barsEl.appendChild(wrap);
  setTimeout(()=>{
    document.getElementById('bf'+i).style.height=heightPct+'%';
    if(cfg.pass) document.getElementById('bq'+i).style.width=qualityPct+'%';
  },400+i*150);
});

function loop(){ctx.clearRect(0,0,c.width,c.height);drawBg();requestAnimationFrame(loop)}
loop();
</script></body></html>
